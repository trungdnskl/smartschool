# ========================================
# Classroom Engagement Analysis System
# Cấu hình hệ thống phân tích lớp học
# ========================================

classroom:
  name: "Phòng STEM 101"
  capacity: 35
  subject: "Toán học"
  grade: "K-12"

# ========================================
# CÀI ĐẶT CAMERA
# ========================================
# Hệ thống hỗ trợ 4 loại nguồn video:
#
# 1. CAMERA IP (RTSP):
#    url: "rtsp://username:password@192.168.1.100:554/stream1"
#    url: "rtsp://admin:admin123@10.0.0.50:554/Streaming/Channels/101"
#
# 2. WEBCAM USB (Gắn trực tiếp vào máy tính):
#    url: "0"        → Webcam mặc định (webcam đầu tiên)
#    url: "1"        → Webcam thứ 2
#    url: "2"        → Webcam thứ 3
#
# 3. FILE VIDEO (Để test/demo):
#    url: "E:/videos/classroom_demo.mp4"
#    url: "C:/Users/test/Desktop/video.avi"
#
# 4. CAMERA IP HTTP (MJPEG):
#    url: "http://192.168.1.100:8080/video"
#
# ========================================
# VÍ DỤ CÁC HÃNG CAMERA IP PHỔ BIẾN
# ========================================
#
# HIKVISION:
#   url: "rtsp://admin:password@IP:554/Streaming/Channels/101"
#   (101 = camera 1 stream chính, 102 = camera 1 stream phụ)
#
# DAHUA:
#   url: "rtsp://admin:password@IP:554/cam/realmonitor?channel=1&subtype=0"
#   (subtype=0: stream chính, subtype=1: stream phụ - nhẹ hơn)
#
# KBVISION:
#   url: "rtsp://admin:password@IP:554/cam/realmonitor?channel=1&subtype=1"
#
# IMOU:
#   url: "rtsp://admin:password@IP:554/cam/realmonitor?channel=1&subtype=0"
#
# TAPO (TP-Link):
#   url: "rtsp://username:password@IP:554/stream1"
#
# EZVIZ:
#   url: "rtsp://admin:password@IP:554/h264/ch1/main/av_stream"
#
# ONVIF (Chuẩn chung):
#   url: "rtsp://admin:password@IP:554/onvif1"
#
# IP CAMERA APP (Dùng điện thoại làm camera):
#   url: "http://192.168.1.xxx:8080/video"
#
# ========================================
# LƯU Ý QUAN TRỌNG:
# ========================================
# - Nên dùng stream PHỤ (sub-stream) cho CPU nhẹ hơn
#   (Thường là 640x480 hoặc 720p thay vì 1080p/4K)
# - Port mặc định RTSP là 554
# - Kiểm tra URL bằng VLC Media Player trước:
#   VLC → Media → Open Network Stream → Dán URL RTSP
# - Đảm bảo camera và máy tính cùng mạng LAN
# ========================================

cameras:
  # Camera 1: Trước bảng (Camera IP Hikvision)
  - id: "cam_front"
    name: "Camera trước bảng"
    url: "rtsp://class6s:SklHill2025!%@192.168.100.14:554/Streaming/Channels/1501"
    enabled: true

  # Camera 2: Sau lớp (Camera IP Hikvision)
  - id: "cam_rear"
    name: "Camera sau lớp"
    url: "rtsp://class6s:SklHill2025!%@192.168.100.14:554/Streaming/Channels/1502"
    enabled: false

  # Camera 3: Webcam USB gắn máy tính
  - id: "cam_usb"
    name: "Webcam USB"
    url: "0"
    enabled: true

detection:
  face_model: "opencv_dnn"       # opencv_dnn (CPU fast) | mediapipe | retinaface
  face_confidence: 0.5
  emotion_model: "fer"           # fer | deepface
  emotion_update_interval: 2.0   # seconds between emotion updates
  head_pose_enabled: true
  frame_skip: 3                  # process every Nth frame (tăng = nhẹ hơn)
  max_faces: 40                  # max faces to track

engagement:
  weights:
    emotion: 0.35
    attention: 0.45
    behavior: 0.20
  alert_threshold: 40            # class avg below this triggers alert
  confusion_alert_duration: 120  # seconds of confusion before alert
  update_interval: 2.0           # seconds between dashboard updates

attendance:
  auto_mark: true
  match_threshold: 0.5             # LBPH face similarity threshold (0-1 normalized)
  deep_face_threshold: 0.30        # ArcFace cosine similarity (0.30 = reliable for 512-dim)
  check_interval: 3                # seconds between attendance checks per face
  late_threshold_minutes: 10

privacy:
  store_face_images: false
  data_retention_days: 90
  anonymize_reports: true
  require_consent: true
  encrypt_embeddings: true

database:
  path: "data/classroom.db"

server:
  host: "0.0.0.0"
  port: 8001
